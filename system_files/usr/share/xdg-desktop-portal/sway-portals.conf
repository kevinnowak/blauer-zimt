# Blauer Zimt — portal backend selection for Sway. See portals.conf(5).
# xdg-desktop-portal reads <desktop>-portals.conf for each entry of
# XDG_CURRENT_DESKTOP; the user session carries "sway". Fedora's own
# wlroots-portals.conf routes Settings to darkman, which this image does not
# ship; the GTK backend answers Settings from gsettings instead.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
